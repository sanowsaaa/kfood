name: Payment checks
on:
  pull_request:
  push:
    branches: [main, codex/payment-integrity-20261007, codex/b2b-security-20261008]
permissions:
  contents: read
jobs:
  payment-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kfood_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d kfood_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kfood_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npm run check:payments
      - run: npm run test:payments
      - run: npm run check:b2b
      - run: npm run test:b2b
      - run: npm run build
      # Global frontend typecheck has pre-existing failures. It is documented in
      # the rollout runbook rather than concealed as a passing payment check.
